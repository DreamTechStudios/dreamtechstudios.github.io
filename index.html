<!DOCTYPE html>
<html lang="en">
<head>

    <style>

            color: #0ed145;

        main {
            max-width: 800px;

<body>

            </p>

            <p>
                <a href="https://nova-os.com"
                   target="_blank"
                   rel="noopener noreferrer">

            <h3>Compatibility Information</h3>
